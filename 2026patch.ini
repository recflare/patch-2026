; Rec Room 2026 patch configuration for client 20260323.14 only.
; Keep this file beside 2026patch.dll. Edit settings before launching the game.
; Changes take effect on the next launch.
; No server address or key is included. Use the details from your server operator.
; Missing/blank overrides keep the client's existing connection details.
; Lines starting with a semicolon are notes. Keep each setting on one line.
; Keys shared with 2025patch.ini (ApiHost, SuppressDuidMismatch, EnableTracing,
; VoiceKeyXml) keep their names and meaning; other 2025 keys are ignored here.

[config]

; Backend host. Bare host name -- no scheme, no path. Example: ns.example.com
; ApiHost rewrites ns.rec.net in the game's discovery requests; discovery supplies
; the other service URLs (API, authentication, notifications, images, etc.).
; A port (localhost:8080) or a full origin (http://localhost:8080) is also accepted;
; without a scheme the request keeps its own. No trailing slash, path or query.
; Leave it EMPTY to leave the client's discovery URL unchanged.
ApiHost=

; Service domain, without a scheme, path or port. Example: example.com
; When ApiHost is set too, its host must be this domain or a subdomain of it.
; Certificate compatibility checks and API cache fixes apply to this domain
; and its subdomains. It must cover the service hosts returned by discovery.
; Missing/blank disables domain-based overrides; client service URLs stay intact.
ServerDomain=

; Previous backend domain whose service URLs were cached by the client.
; Example: old.example.org rewrites api.old.example.org to api.example.com
; when ServerDomain=example.com. Service prefixes and ports are retained.
; Already-current URLs are left alone. Requires ServerDomain; blank disables it.
CachedServerDomain=

; true = bypass the legacy certificate pin check for ServerDomain/subdomains only.
; Other hosts retain their original certificate policy. false = keep native checks.
; Default true provides compatibility with custom backend certificates.
DisableCertificatePinning=true

; true = accept images not signed by the retired official image service.
; This setting applies to all images checked by the patch.
; false = keep original image signature checks. Default: true.
AllowUnsignedImages=true

; Default: 0 = keep original client screen-sharing presets. Set 1-60 for a target FPS.
; Adaptive throttling and waiting for earlier frames can lower the delivered rate.
; Higher values require more upload bandwidth; resolution/quality are unchanged.
FramesPerSecond=0

; Force the device-id (DUID) mismatch check to false. Fixes the launch / Create Account
; hang on a machine with a corrupt stored device id; a no-op on healthy machines.
; Default: true. Same setting as in 2025patch.ini.
SuppressDuidMismatch=true

; false = startup, connection state and failures only (default).
; true = extra HTTP/hook diagnostics for troubleshooting; turn off after testing.
; Log: 2026patch.log beside the DLL. Reset each launch, capped at 1 MiB.
; HTTP paths, queries, headers and image contents are not logged.
EnableTracing=false

; Voice (Tachyon) RSA PUBLIC key, .NET <RSAKeyValue> XML on ONE line. Never put a
; private key here.
; Format: <RSAKeyValue><Modulus>BASE64_MODULUS</Modulus><Exponent>AQAB</Exponent></RSAKeyValue>
; Obtain the public key from your server operator. Only Modulus and Exponent
; fields are allowed. The matching private key stays on the Tachyon server.
; EMPTY = keep the client's key. The room/voice endpoint always comes from
; matchmaking; a supplied key applies to that endpoint.
VoiceKeyXml=
